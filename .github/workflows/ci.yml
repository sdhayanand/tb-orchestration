name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '23 8 * * 1-5'   # nightly API tests against the latest images

permissions:
  contents: read
  packages: read

jobs:
  dags:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: composer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v6
      - name: install Airflow 2.9.3 (same resolver + constraints as local dev)
        shell: bash
        run: |
          set -o pipefail
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements-dev.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.12.txt" 2>&1 | tee ../dag-build.log
          # The Google provider's Dataflow operators import the Beam *provider* module; the DAGs never
          # run Beam locally, so install the provider without pulling apache-beam (which conflicts
          # with the Airflow 2.9.3 constraints). Composer images ship both.
          uv pip install --python .venv/bin/python --no-deps "apache-airflow-providers-apache-beam==5.7.1" 2>&1 | tee -a ../dag-build.log
      - name: DAG integrity tests
        shell: bash
        env: { AIRFLOW_HOME: /tmp/airflow, AIRFLOW__CORE__LOAD_EXAMPLES: "False" }
        run: |
          set -o pipefail
          .venv/bin/airflow db migrate >/dev/null 2>&1 || true
          .venv/bin/pytest tests -q -rA 2>&1 | tee -a ../dag-build.log
      - name: publish errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "Error|error:|FAILED|assert|No solution|Because " ../dag-build.log | awk '!seen[$0]++' | head -n 30 | while IFS= read -r line; do
            echo "::error title=dags::${line:0:900}"
          done

  lint:
    name: Validate Postman / JMeter / SoapUI files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('postman/*.json')]; print('postman json ok')"
      - run: python3 -c "import xml.dom.minidom as m; m.parse('jmeter/order-intake-load.jmx'); m.parse('soapui/tb-legacy-oms-soapui-project.xml'); print('xml ok')"
      - run: bash -n scheduler/*.sh

  api-tests:
    name: Newman + JMeter against the local platform stack
    needs: [lint]
    # Needs the service images in GHCR, which the other repos publish; run nightly or on demand.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: checkout tb-platform-infra (compose stack)
        uses: actions/checkout@v4
        with:
          repository: sdhayanand/tb-platform-infra
          path: infra
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: start stack
        run: |
          cd infra/local && docker compose pull -q && docker compose up -d
          for i in $(seq 1 60); do curl -fsS localhost:8080/actuator/health/readiness >/dev/null 2>&1 && curl -fsS localhost:8081/actuator/health/readiness >/dev/null 2>&1 && break; sleep 5; done
          docker compose ps
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Newman
        run: |
          npm i -g newman newman-reporter-htmlextra
          newman run postman/tb-otd.postman_collection.json -e postman/local.postman_environment.json \
            --delay-request 1500 --timeout-request 20000 -r cli,htmlextra --reporter-htmlextra-export reports/newman.html
      - name: cache JMeter
        uses: actions/cache@v4
        with:
          path: /tmp/apache-jmeter-5.6.3
          key: jmeter-5.6.3
      - name: install JMeter (CDN first; the archive mirror took 11 minutes)
        run: |
          [ -x /tmp/apache-jmeter-5.6.3/bin/jmeter ] && exit 0
          for u in https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz \
                   https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz; do
            curl -fsSL --retry 3 --max-time 300 "$u" | tar xz -C /tmp && exit 0
          done
          exit 1
      - name: JMeter smoke profile
        run: |
          mkdir -p reports
          (cd jmeter && /tmp/apache-jmeter-5.6.3/bin/jmeter -n -t order-intake-load.jmx -l ../reports/results.jtl -e -o ../reports/jmeter \
            -Jhost=localhost -Jport=8080 -Jusers=5 -Jramp=5 -Jloops=5 -JmaxMs=1500)
          python3 - <<'EOF'
          import csv, collections
          rows = list(csv.DictReader(open('reports/results.jtl')))
          errs = [r for r in rows if r['success'] != 'true']
          print(f"samples={len(rows)} errors={len(errs)}")
          for (label, code, msg), n in collections.Counter((r['label'], r['responseCode'], (r.get('failureMessage') or '')[:200]) for r in errs).most_common(10):
              print(f"::error title=jmeter::{n}x {label} -> {code} {msg}")
          assert rows and len(errs) * 100.0 / len(rows) < 1.0, "error rate >= 1%"
          EOF
      - name: SoapUI (open-source runner)
        continue-on-error: true
        run: |
          docker run --rm --network host -v "$PWD/soapui":/project -v "$PWD/reports":/reports smartbear/soapuios-testrunner:latest \
            -r -j -f /reports/soapui /project/tb-legacy-oms-soapui-project.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-reports, path: reports }
      - name: logs on failure
        if: failure()
        run: cd infra/local && docker compose logs --no-color --tail=100
      - if: always()
        run: cd infra/local && docker compose down -v
